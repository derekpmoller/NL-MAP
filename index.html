<!DOCTYPE html>
<html>
<head>
    <title>Newfoundland and Labrador Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        body {
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        var map = L.map('map').setView([53.1355, -57.6604], 6);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        L.marker([47.5615, -52.7126])
        .addTo(map)
        .bindPopup('St. John\'s')
        .openPopup();
    </script>

</body>
</html>
