<!DOCTYPE html>
<html>

<head>
    <title>Newfoundland & Labrador Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />


    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        body {
            margin: 0;
        }

        #title {
            position: absolute;
            top: 10px;
            left: 80px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>

<body>

    <h1 id="title">Newfoundland and Labrador Explorer</h1>

    <div id="map"></div>




    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([52.8, -58.5], 6);

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }
        ).addTo(map);

        L.marker([47.5615, -52.7126])
            .addTo(map)
            .bindPopup('<b>St. John\'s</b><br>Capital of Newfoundland and Labrador');

        L.marker([48.95, -57.95]).addTo(map).bindPopup('<b>Corner Brook</b><br>West Coast');
        L.marker([48.95, -54.61]).addTo(map).bindPopup('<b>Gander</b><br>Central Newfoundland');
        L.marker([48.55, -56.15]).addTo(map).bindPopup('<b>Grand Falls-Windsor</b><br>Central Newfoundland');
        L.marker([53.30, -60.33]).addTo(map).bindPopup('<b>Happy Valley-Goose Bay</b><br>Labrador');
        L.marker([52.95, -66.92]).addTo(map).bindPopup('<b>Labrador City</b><br>Western Labrador');

        function loadRegion(file, regionName, colour) {

            fetch(file)
                .then(response => response.json())
                .then(data => {

                    const regionLayer = L.geoJSON(data, {

                        style: {
                            color: colour,
                            fillColor: colour,
                            fillOpacity: 0.3,
                            weight: 2
                        },

                        onEachFeature: function (feature, layer) {
                            layer.bindPopup('<b>' + regionName + '</b>');
                            layer.on('click', function () {
                                map.fitBounds(layer.getBounds());
                                layer.openPopup();
                            });

                        }

                    }).addTo(map);

                    function updateStyle() {

                        const zoom = map.getZoom();

                        regionLayer.setStyle({
                            color: colour,
                            fillColor: colour,
                            weight: 2,
                            fillOpacity: zoom < 10 ? 0.3 : 0
                        });

                    }

                    map.on('zoomend', updateStyle);
                    updateStyle();

                });

        }



        const regions = [
            {
                file: 'Data/NL-Avalon_AUG_26_2026.geojson',
                name: 'Avalon Peninsula',
                colour: '#F4D03F',
                "code": "NL-AVALON",
                "author": "Derek Moller",
                "created": "2026-08-26"
            },
            {
                file: 'Data/NL-Burin_AUG_27_2026_2.geojson',
                name: 'Burin Peninsula',
                colour: '#E67E73',
                "code": "NL-Burin",
                "author": "Derek Moller",
                "created": "2026-08-27"
            },
            {
                file: 'Data/NL-Bonavista_AUG_28_2026.geojson',
                name: 'Bonavista Peninsula',
                colour: '#5DADE2',
                "code": "NL-Bonavista",
                "author": "Derek Moller",
                "created": "2026-08-28"
            },
            {
                file: 'Data/NL-South_West_Coast_AUG_28_2026.geojson',
                name: 'Southwest Coast',
                colour: '#DC2626',
                "code": "NL-South_West_Coast",
                "author": "Derek Moller",
                "created": "2026-08-28"
            },
            {
                file: 'Data/NL-Northern_Peninsula_AUG_28_2026.geojson',
                name: 'Northern Peninsula',
                colour: '#27AE60',
                code: 'NL-Northern_Peninsula',
                author: 'Derek Moller',
                created: '2026-08-28'
            },
            {
                file: 'Data/NL-South_Coast_AUG_28_2026.geojson',
                name: 'South Coast',
                colour: '#48C9B0',
                code: 'NL-South_Coast',
                author: 'Derek Moller',
                created: '2026-08-28'
            },
            {
                file: 'Data/NL-Central_AUG_28_2026.geojson',
                name: 'Central Newfoundland',
                colour: '#95A5A6',
                code: 'NL-Central',
                author: 'Derek Moller',
                created: '2026-08-28'
            },
            {
                file: 'Data/NL-Labrador_AUG_28_2026.geojson',
                name: 'Labrador',
                colour: '#D4A017',
                code: 'NL-Labrador',
                author: 'Derek Moller',
                created: '2026-08-28'
            }

        ];

        regions.forEach(region => {
            loadRegion(
                region.file,
                region.name,
                region.colour
            );
        });

    </script>

</body>

</html>
