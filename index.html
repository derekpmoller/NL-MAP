            border-radius: 5px;

        }

        #communitySearch {
            width: 290px;
        }

        #autocomplete-list {
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;

            position: absolute;

            width: 330px;

            z-index: 1001;

            display: none;
        }

        .autocomplete-item {
            padding: 8px;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }

        #info-panel {
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }
    </style>
</head>

        function loadRegion(region) {

            fetch(region.file)
                .then(response => response.json())
                .then(data => {

                    const regionLayer = L.geoJSON(data, {

                        style: {
                            color: region.colour,
                            fillColor: region.colour,
                            fillOpacity: 0.3,
                            weight: 2
                        },

                        onEachFeature: function (feature, layer) {

                            layer.bindPopup('<b>' + region.name + '</b>');

                            layer.on('click', function () {

                                map.fitBounds(layer.getBounds());
                                layer.openPopup();

                                document.getElementById('info-panel').innerHTML = `
                                <h2>${region.name}</h2>

                                
                                <hr>

                                <p>${region.description || ''}</p>

                                <p><strong>Major Communities</strong><br>
                                ${region.majorCommunities || ''}</p>

                                <p><strong>Key Attractions</strong><br>
                                ${region.attractions || ''}</p>

                               <p><strong>Hidden Gems</strong><br>
                                ${region.hiddenGems || ''}</p>
                        
                            `;
                            });

                            layer.on('mouseover', function () {
                                this.setStyle({
                                    weight: 4,
                                    fillOpacity: 0.5
                                });
                            });

                            layer.on('mouseout', function () {
                                this.setStyle({
                                    weight: 2,
                                    fillOpacity: map.getZoom() < 10 ? 0.3 : 0
                                });
                            });

                        }

                    }).addTo(map);

                    function updateStyle() {

                        const zoom = map.getZoom();

                        regionLayer.setStyle({
                            color: region.colour,
                            fillColor: region.colour,
                            weight: 2,
                            fillOpacity: zoom < 10 ? 0.3 : 0
                        });

                    }

                    map.on('zoomend', updateStyle);
                    updateStyle();

                });

        }

        function findCommunity() {

            const searchValue =
                document.getElementById('communitySearch')
                    .value
                    .trim()
                    .toLowerCase();


            const community = communities.find(c =>
                c.name.toLowerCase().includes(searchValue)
            );

            let result = community;

            if (!result) {

                const attraction = attractions.find(a =>
                    a.name.toLowerCase().includes(searchValue)
                );

                result = attraction;
            }

            if (!result) {

                alert('No matching destination found.');

                return;

            }

            const zoomLevel = 10
            if (window.innerWidth < 768) {
                alert('Mobile centering code running +1000');

                const point = map.project(
                    [result.lat, result.lon],
                    zoomLevel
                );

                point.y += 1000;

                const adjustedLatLng =
                    map.unproject(point, zoomLevel);

                map.setView(
                    adjustedLatLng,
                    zoomLevel
                );

            }
            else {

                map.setView(
                    [result.lat, result.lon],
                    zoomLevel
                );

            }

            if (searchMarker) {
                map.removeLayer(searchMarker);
            }

            if (result.type === 'hiddenGem') {

                searchMarker = L.marker(
                    [result.lat, result.lon],
                    { icon: hiddenGemIcon }
                ).addTo(map);

            }
            else if (result.type === 'attraction') {

                searchMarker = L.marker(
                    [result.lat, result.lon],
                    { icon: attractionIcon }
                ).addTo(map);

            }
            else {

                searchMarker = L.marker(
                    [result.lat, result.lon]
                ).addTo(map);

            }

            let resultType = 'Community';

            if (result.type === 'attraction') {
                resultType = 'Attraction';
            }
            else if (result.type === 'hiddenGem') {
                resultType = 'Hidden Gem';
            }

            searchMarker.bindPopup(
                `<b>${result.name}</b><br><small>${resultType}</small>`
            ).openPopup();

            const region = regions.find(r =>
                r.name === result.region
            );
            if (!region) {
                alert('Region not found.');
                return;
            }

            document.getElementById('info-panel').innerHTML = `
    <h2>${region.name}</h2>

    <hr>

    <p>${region.description || ''}</p>

    <p><strong>Major Communities</strong><br>
    ${region.majorCommunities || ''}</p>

    <p><strong>Key Attractions</strong><br>
    ${region.attractions || ''}</p>

    <p><strong>Hidden Gems</strong><br>
    ${region.hiddenGems || ''}</p>
    `;


        }

        function handleSearch(event) {

            if (event.key === 'Enter') {
                findCommunity();
            }

        }

        function showAutocomplete() {

            const searchValue =
                document.getElementById('communitySearch')
                    .value
                    .trim()
                    .toLowerCase();

            const list =
                document.getElementById('autocomplete-list');

            list.innerHTML = '';

            if (searchValue.length < 2) {
                list.style.display = 'none';
                return;
            }

            const matches = searchItems
                .filter(item =>
                    item.name.toLowerCase().includes(searchValue)
                )
                .slice(0, 8);

            matches.forEach(item => {

                const div = document.createElement('div');

                div.className = 'autocomplete-item';

                div.textContent = item.name;

                div.onclick = function () {

                    document.getElementById('communitySearch').value =
                        item.name;

                    list.style.display = 'none';

                    findCommunity();

                };

                list.appendChild(div);

            });

            list.style.display =
                matches.length ? 'block' : 'none';

        }
