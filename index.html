<!DOCTYPE html>
<html>

<head>
    <title>Newfoundland & Labrador Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />


    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        body {
            margin: 0;
        }

        #title {
            position: absolute;
            top: 10px;
            left: 80px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.95);
        }

        #info-panel {
            position: absolute;
            top: 70px;
            right: 10px;
            width: 300px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 5px;

            font-family: Arial, sans-serif;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #info-panel h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <h1 id="title">Newfoundland and Labrador Explorer</h1>

    <div id="info-panel">
        <h2>Tourism Region</h2>
        <p>Click a region to view information.</p>
    </div>


    <div id="map"></div>




    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([52.8, -58.5], 6);

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }
        ).addTo(map);

        L.marker([47.5615, -52.7126])
            .addTo(map)
            .bindPopup('<b>St. John\'s</b><br>Capital of Newfoundland and Labrador');

        L.marker([48.95, -57.95]).addTo(map).bindPopup('<b>Corner Brook</b><br>West Coast');
        L.marker([48.95, -54.61]).addTo(map).bindPopup('<b>Gander</b><br>Central Newfoundland');
        L.marker([48.55, -56.15]).addTo(map).bindPopup('<b>Grand Falls-Windsor</b><br>Central Newfoundland');
        L.marker([53.30, -60.33]).addTo(map).bindPopup('<b>Happy Valley-Goose Bay</b><br>Labrador');
        L.marker([52.95, -66.92]).addTo(map).bindPopup('<b>Labrador City</b><br>Western Labrador');

        function loadRegion(region) {

            fetch(region.file)
                .then(response => response.json())
                .then(data => {

                    const regionLayer = L.geoJSON(data, {

                        style: {
                            color: region.colour,
                            fillColor: region.colour,
                            fillOpacity: 0.3,
                            weight: 2
                        },

                        onEachFeature: function (feature, layer) {

                            layer.bindPopup('<b>' + region.name + '</b>');

                            layer.on('click', function () {

                                map.fitBounds(layer.getBounds());
                                layer.openPopup();

                                document.getElementById('info-panel').innerHTML = `
                                <h2>${region.name}</h2>

                                
                                <hr>

                                <p>${region.description || ''}</p>

                                <p><strong>Major Communities</strong><br>
                                ${region.majorCommunities || ''}</p>

                                <p><strong>Key Attractions</strong><br>
                                ${region.attractions || ''}</p>

                               <p><strong>Hidden Gems</strong><br>
                                ${region.hiddenGems || ''}</p>
                        
                            `;
                            });

                            layer.on('mouseover', function () {
                                this.setStyle({
                                    weight: 4,
                                    fillOpacity: 0.5
                                });
                            });

                            layer.on('mouseout', function () {
                                this.setStyle({
                                    weight: 2,
                                    fillOpacity: map.getZoom() < 10 ? 0.3 : 0
                                });
                            });

                        }

                    }).addTo(map);

                    function updateStyle() {

                        const zoom = map.getZoom();

                        regionLayer.setStyle({
                            color: region.colour,
                            fillColor: region.colour,
                            weight: 2,
                            fillOpacity: zoom < 10 ? 0.3 : 0
                        });

                    }

                    map.on('zoomend', updateStyle);
                    updateStyle();

                });

        }



        const regions = [
            {
                file: 'Data/NL-Avalon_AUG_26_2026.geojson',
                name: 'Avalon Peninsula',
                colour: '#F4D03F',
                description: 'The historic and cultural heart of Newfoundland and Labrador, featuring colourful communities, dramatic coastlines, world-renowned heritage sites, whale watching, icebergs, and the province\'s capital city of St. John\'s.',
                majorCommunities: 'St. John\'s, Mount Pearl, Paradise, Conception Bay South, Holyrood, Bay Roberts, Carbonear, Ferryland',
                attractions: 'Cape Spear National Historic Site, Signal Hill National Historic Site, George Street, Quidi Vidi Village, Irish Loop, Ferryland Lighthouse, East Coast Trail, Mistaken Point UNESCO World Heritage Site'
            },

            {
                file: 'Data/NL-Labrador_AUG_28_2026.geojson',
                name: 'Labrador',
                colour: '#D4A017',
                description: 'A vast and rugged land of mountains, tundra, Indigenous cultures, historic fishing settlements, and some of Canada\'s most remote wilderness.',
                majorCommunities: 'Happy Valley-Goose Bay, Labrador City, Wabush, Nain, Cartwright, Red Bay',
                attractions: 'Torngat Mountains National Park, Red Bay UNESCO World Heritage Site, Churchill Falls',
                hiddenGems: 'Battle Harbour, Point Amour Lighthouse, The Wonderstrands, Tracey Hill Trail, North Coast Inuit Communities'
            },
            {
                file: 'Data/NL-Northern_Peninsula_AUG_28_2026.geojson',
                name: 'Northern Peninsula',
                colour: '#27AE60',
                description: 'A rugged peninsula renowned for Viking history, dramatic coastal scenery, whales, icebergs, national parks, and some of Newfoundland and Labrador\'s most iconic travel experiences.',
                majorCommunities: 'St. Anthony, Norris Point, Rocky Harbour, Port au Choix, Cow Head, Roddickton-Bide Arm',
                attractions: 'L\'An1se aux Meadows UNESCO World Heritage Site, Gros Morne National Park, Western Brook Pond, Port au Choix National Historic Site, Arches Provincial Park, St. Anthony Whale Watching',

            },
            {
                file: 'Data/NL-South_West_Coast_AUG_28_2026.geojson',
                name: 'Southwest Coast',
                colour: '#DC2626',
                description: 'A spectacular coastal region known for fjords, mountains, fishing communities, rich cultural heritage, and gateway access to some of Newfoundland and Labrador\'s most dramatic landscapes.',
                majorCommunities: 'Port aux Basques, Channel-Port aux Basques, Stephenville, Burgeo, Codroy Valley, Rose Blanche-Harbour le Cou',
                attractions: 'Codroy Valley, Cape Ray Lighthouse, Rose Blanche Lighthouse, Sandbanks Provincial Park, J.T. Cheeseman Provincial Park, Barachois Pond Provincial Park, Port aux Basques Railway Heritage Centre'
            },
            {
                file: 'Data/NL-South_Coast_AUG_28_2026.geojson',
                name: 'South Coast',
                colour: '#48C9B0',
                description: 'A remote and spectacular coastline of fjords, islands, fishing communities, and rugged wilderness where many communities remain connected by the sea rather than by road.',
                majorCommunities: 'Burgeo, Harbour Breton, Ramea, Francois, McCallum, Gaultois, Grey River',
                attractions: 'Marine fjords and coastal scenery, Ramea Islands, Grand Bruit heritage area, Coast of Bays region, South Coast ferry network, Sea kayaking, Whale and seabird viewing'
            },
            {
                file: 'Data/NL-Central_AUG_28_2026.geojson',
                name: 'Central Newfoundland',
                colour: '#95A5A6',
                description: 'The heart of Newfoundland, known for its vast forests, rivers, lakes, outdoor adventures, rich logging and railway history, and easy access to many of the province\'s natural attractions.',
                majorCommunities: 'Gander, Grand Falls-Windsor, Lewisporte, Twillingate, Bishop\'s Falls, Botwood',
                attractions: 'Twillingate Iceberg Capital of the World, Beothuk Interpretation Centre, Gander Aviation History, Exploits River, Corduroy Brook Nature Trail, Salmonid Interpretation Centre, Notre Dame Bay'
            },
            {
                file: 'Data/NL-Burin_AUG_27_2026_2.geojson',
                name: 'Burin Peninsula',
                colour: '#E67E73',
                description: 'Known as Newfoundland’s "Boot", the Burin Peninsula offers a rich fishing heritage, dramatic coastal scenery, historic communities, and a unique connection to the province’s past and present maritime culture.',
                majorCommunities: 'Marystown, Burin, Grand Bank, St. Lawrence, Lamaline, Fortune',
                attractions: 'Fortune Head UNESCO Global Geopark, Grand Bank Historic District, Burin Heritage Square, St. Lawrence Miner\'s Museum, Cape St. Mary\'s nearby seabird sanctuary access, French islands gateway via Fortune'
            },
            {
                file: 'Data/NL-Bonavista_AUG_28_2026.geojson',
                name: 'Bonavista Peninsula',
                colour: '#5DADE2',
                description: 'A region of rugged coastlines, historic fishing communities, world-famous puffin colonies, icebergs, and some of Newfoundland and Labrador\'s most picturesque towns and coastal landscapes.',
                majorCommunities: "Bonavista, Trinity, Elliston, Catalina, Port Union, King's Cove",
                attractions: 'Cape Bonavista Lighthouse, Trinity Historic Town, Elliston Puffin Viewing Site, Dungeon Provincial Park, Ryan Premises National Historic Site, Port Union Historic District, Skerwink Trail'
            }

        ];

        regions.forEach(region => {
            loadRegion(region)


        });

    </script>

</body>

</html>
