<!DOCTYPE html>
<html>
<head>
    <title>Newfoundland & Labrador Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    

    <style>
      #map {
        height: 100vh;
        width: 100%;
      }

      body {
        margin: 0;
      }

      #title {
        position: absolute;
        top: 10px;
        left: 80px;
        z-index: 1000;
        background: white;
        padding: 8px 15px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        margin: 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        background: rgba(255,255,255,0.95);
      }
</style>
</head>

<body>

    <h1 id="title">Newfoundland and Labrador Explorer</h1>

    <div id="map"></div>

   


    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        var map = L.map('map').setView([52.8, -58.5], 6);

        L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            {
                attribution: '&copy; OpenStreetMap contributors & CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }
        ).addTo(map);

        L.marker([47.5615, -52.7126])
        .addTo(map)
        .bindPopup('<b>St. John\'s</b><br>Capital of Newfoundland and Labrador');

        L.marker([48.95, -57.95]).addTo(map).bindPopup('<b>Corner Brook</b><br>West Coast');
        L.marker([48.95, -54.61]).addTo(map).bindPopup('<b>Gander</b><br>Central Newfoundland');
        L.marker([48.55, -56.15]).addTo(map).bindPopup('<b>Grand Falls-Windsor</b><br>Central Newfoundland');
        L.marker([53.30, -60.33]).addTo(map).bindPopup('<b>Happy Valley-Goose Bay</b><br>Labrador');
        L.marker([52.95, -66.92]).addTo(map).bindPopup('<b>Labrador City</b><br>Western Labrador');
        
        var avalon = L.polygon([
            [47.8, -53.8],
            [47.3, -52.8],
            [46.8, -52.6],
            [46.8, -54.2]
        ], {
            color: '#ffcc00',
            fillColor: '#ffcc00',
            fillOpacity: 0.3,
            weight: 2
        }).addTo(map);

        avalon.bindPopup('<b>Avalon Peninsula</b>');
        
    </script>

</body>
</html>
