    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        body {
            margin: 0;
        }

        #title {
            position: absolute;
            top: 10px;
            left: 80px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.95);
        }

        #info-panel {
            position: absolute;
            top: 110px;
            right: 10px;
            width: 300px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 5px;

            font-family: Arial, sans-serif;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #info-panel h2 {
            margin-top: 0;
        }


        #search-box {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;

            width: 390px;

            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 5px;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #communitySearch {
            width: 290px;
        }

        #autocomplete-list {
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;

            position: absolute;

            width: 330px;

            z-index: 1001;

            display: none;
        }

        .autocomplete-item {
            padding: 8px;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }

        #info-panel {
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        #info-toggle {
            display: none;
        }

        /* Mobile phone layout */

        @media (max-width: 767px) {
            #info-toggle {
                display: block;
                position: absolute;
                right: 10px;
                bottom: 35px;
                z-index: 1001;
                padding: 10px 16px;
                border: none;
                border-radius: 5px;
                background: #ffffff;
                color: #222222;
                font-family: Arial, sans-serif;
                font-size: 16px;
                font-weight: bold;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
                cursor: pointer;
            }

            #info-panel {
                display: none;
                top: auto;
                right: 10px;
                bottom: 85px;
                left: 10px;
                width: auto;
                max-height: 55vh;
                overflow-y: auto;
                padding: 15px;
            }

            #info-panel.mobile-open {
                display: block;
            }

            #title {
                top: 10px;
                left: 60px;
                right: 10px;
                width: auto;
                font-size: 16px;
                text-align: center;
            }

            #search-box {
                top: 80px;
                left: 10px;
                right: 10px;
                width: auto;
            }

            #communitySearch {
                width: calc(100% - 90px);
            }

        }

        /* Tablet layout */
        @media (min-width: 768px) and (max-width: 1024px) {

            #title {
                left: 60px;
                width: 320px;
                text-align: left;
                font-size: 18px;
            }

            #search-box {
                top: 10px;
                right: 10px;
                width: 280px;
            }

            #communitySearch {
                width: 180px;
            }
        }
    </style>

            return window.innerWidth < 768;

        function openInfoPanel() {

            if (isMobileView()) {
                document
                    .getElementById('info-panel')
                    .classList.add('mobile-open');

                document.getElementById('info-toggle').textContent = 'Close';
            }
        }

        function closeInfoPanel() {
            if (isMobileView()) {
                document
                    .getElementById('info-panel')
                    .classList.remove('mobile-open');

                document.getElementById('info-toggle').textContent = 'Info';
            }
        }

        function toggleInfoPanel() {
            const panel = document.getElementById('info-panel');

            if (panel.classList.contains('mobile-open')) {
                closeInfoPanel();
            } else {
                openInfoPanel();
            }
        }

        function loadRegion(region) {

            fetch(region.file)
                .then(response => response.json())
                .then(data => {

                    const regionLayer = L.geoJSON(data, {

                        style: {
                            color: region.colour,
                            fillColor: region.colour,
                            fillOpacity: 0.3,
                            weight: 2
                        },

                        onEachFeature: function (feature, layer) {

                            layer.bindPopup('<b>' + region.name + '</b>');

                            layer.on('click', function () {

                                map.fitBounds(layer.getBounds());
                                layer.openPopup();

                                document.getElementById('info-panel').innerHTML = `
                                <h2>${region.name}</h2>

                                
                                <hr>

                                <p>${region.description || ''}</p>

                                <p><strong>Major Communities</strong><br>
                                ${region.majorCommunities || ''}</p>

                                <p><strong>Key Attractions</strong><br>
                                ${region.attractions || ''}</p>

                               <p><strong>Hidden Gems</strong><br>
                                ${region.hiddenGems || ''}</p>
                        
                            `;
                                openInfoPanel();
                            });

                            layer.on('mouseover', function () {
                                this.setStyle({
                                    weight: 4,
                                    fillOpacity: 0.5
                                });
                            });

                            layer.on('mouseout', function () {
                                this.setStyle({
                                    weight: 2,
                                    fillOpacity: map.getZoom() < 10 ? 0.3 : 0
                                });
                            });

                        }

                    }).addTo(map);

                    function updateStyle() {

                        const zoom = map.getZoom();

                        regionLayer.setStyle({
                            color: region.colour,
                            fillColor: region.colour,
                            weight: 2,
                            fillOpacity: zoom < 10 ? 0.3 : 0
                        });

                    }

                    map.on('zoomend', updateStyle);
                    updateStyle();

                });

        }

        function findCommunity() {

            closeInfoPanel();

            const searchValue =
                document.getElementById('communitySearch')
                    .value
                    .trim()
                    .toLowerCase();


            const community = communities.find(c =>
                c.name.toLowerCase().includes(searchValue)
            );

            let result = community;

            if (!result) {

                const attraction = attractions.find(a =>
                    a.name.toLowerCase().includes(searchValue)
                );

                result = attraction;
            }

            if (!result) {

                alert('No matching destination found.');

                return;

            }

            localStorage.setItem(
                'lastDestination',
                result.name
            );

            const zoomLevel = 10
            if (window.innerWidth < 768) {

                const point = map.project(
                    [result.lat, result.lon],
                    zoomLevel
                );

                point.y += 100;

                const adjustedLatLng =
                    map.unproject(point, zoomLevel);

                map.setView(
                    adjustedLatLng,
                    zoomLevel
                );

            }
            else {

                map.setView(
                    [result.lat, result.lon],
                    zoomLevel
                );

            }

            if (searchMarker) {
                map.removeLayer(searchMarker);
            }

            if (result.type === 'hiddenGem') {

                searchMarker = L.marker(
                    [result.lat, result.lon],
                    { icon: hiddenGemIcon }
                ).addTo(map);

            }
            else if (result.type === 'attraction') {

                searchMarker = L.marker(
                    [result.lat, result.lon],
                    { icon: attractionIcon }
                ).addTo(map);

            }
            else {

                searchMarker = L.marker(
                    [result.lat, result.lon]
                ).addTo(map);

            }

            let resultType = 'Community';

            if (result.type === 'attraction') {
                resultType = 'Attraction';
            }
            else if (result.type === 'hiddenGem') {
                resultType = 'Hidden Gem';
            }

            searchMarker.bindPopup(
                `<b>${result.name}</b><br><small>${resultType}</small>`
            ).openPopup();

            if (result.type === 'attraction') {
                showAttractionDetails(result.name);
                return;
            }

            if (result.type === 'hiddenGem') {
                showHiddenGemDetails(result.name);
                return;
            }
            const region = regions.find(r =>
                r.name === result.region
            );
            if (!region) {
                alert('Region not found.');
                return;
            }

            document.getElementById('info-panel').innerHTML = `
    <h2>${region.name}</h2>

    <hr>

    <p>${region.description || ''}</p>

    <p><strong>Major Communities</strong><br>
    ${region.majorCommunities || ''}</p>

    <p><strong>Key Attractions</strong><br>
    ${region.attractions || ''}</p>

    <p><strong>Hidden Gems</strong><br>
    ${region.hiddenGems || ''}</p>
    `;


        }

        function handleSearch(event) {

            if (event.key === 'Enter') {
                findCommunity();
            }

        }

            }

            const matches = searchItems
                .filter(item =>
                    item.name.toLowerCase().includes(searchValue)
                )
                .slice(0, 15);

            matches.forEach(item => {

                const div = document.createElement('div');

                div.className = 'autocomplete-item';

                div.textContent = item.name;

                div.onclick = function () {

                    document.getElementById('communitySearch').value =
                        item.name;

                    list.style.display = 'none';

                    findCommunity();

                };

                list.appendChild(div);

            });

            list.style.display =
                matches.length ? 'block' : 'none';

        }

        function restoreLastDestination() {

            const lastDestination =
                localStorage.getItem('lastDestination');

            if (!lastDestination) {
                return;
            }

            document.getElementById('communitySearch').value =
                lastDestination;

            findCommunity();

        }

        regions.forEach(region => {
            loadRegion(region);
        });

        window.addEventListener(
            'load',
            restoreLastDestination
        );

    </script>


</body>

</html>
