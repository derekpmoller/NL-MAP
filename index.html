        L.marker([47.5615, -52.7126])
            .addTo(map)
            .bindPopup('<b>St. John\'s</b><br>Capital of Newfoundland and Labrador');

        L.marker([48.95, -57.95]).addTo(map).bindPopup('<b>Corner Brook</b><br>West Coast');
        L.marker([48.95, -54.61]).addTo(map).bindPopup('<b>Gander</b><br>Central Newfoundland');

        function loadRegion(region) {

            fetch(region.file)
                .then(response => response.json())
                .then(data => {

                    const regionLayer = L.geoJSON(data, {

                        style: {
                            color: region.colour,
                            fillColor: region.colour,
                            fillOpacity: 0.3,
                            weight: 2
                        },

                        onEachFeature: function (feature, layer) {

                            layer.bindPopup('<b>' + region.name + '</b>');

                            layer.on('click', function () {

                                map.fitBounds(layer.getBounds());
                                layer.openPopup();

                                document.getElementById('info-panel').innerHTML = `
                                <h2>${region.name}</h2>

                                
                                <hr>

                                <p>${region.description || ''}</p>

                                <p><strong>Major Communities</strong><br>
                                ${region.majorCommunities || ''}</p>

                                <p><strong>Key Attractions</strong><br>
                                ${region.attractions || ''}</p>

                               <p><strong>Hidden Gems</strong><br>
                                ${region.hiddenGems || ''}</p>
                        
                            `;
                            });

                            layer.on('mouseover', function () {
                                this.setStyle({
                                    weight: 4,
                                    fillOpacity: 0.5
                                });
                            });

                            layer.on('mouseout', function () {
                                this.setStyle({
                                    weight: 2,
                                    fillOpacity: map.getZoom() < 10 ? 0.3 : 0
                                });
                            });

                        }

                    }).addTo(map);

                    function updateStyle() {

                        const zoom = map.getZoom();

                        regionLayer.setStyle({
                            color: region.colour,
                            fillColor: region.colour,
                            weight: 2,
                            fillOpacity: zoom < 10 ? 0.3 : 0
                        });

                    }

                    map.on('zoomend', updateStyle);
                    updateStyle();

                });

        }

        function findCommunity() {

            const searchValue =
                document.getElementById('communitySearch')
                    .value
                    .trim()
                    .toLowerCase();


            const community = communities.find(c =>
                c.name.toLowerCase().includes(searchValue)
            );

            if (!community) {

                alert('Community not found.');

                return;

            }
            map.setView(
                [community.lat, community.lon],
                10
            );

            if (searchMarker) {
                map.removeLayer(searchMarker);
            }

            searchMarker = L.marker([
                community.lat,
                community.lon
            ]).addTo(map);

            searchMarker.bindPopup(
                `<b>${community.name}</b>`
            ).openPopup();

            const region = regions.find(r =>
                r.name === community.region
            );
            if (!region) {
                alert('Region not found.');
                return;
            }

            document.getElementById('info-panel').innerHTML = `
    <h2>${region.name}</h2>

    <hr>

    <p>${region.description || ''}</p>

    <p><strong>Major Communities</strong><br>
    ${region.majorCommunities || ''}</p>

    <p><strong>Key Attractions</strong><br>
    ${region.attractions || ''}</p>

    <p><strong>Hidden Gems</strong><br>
    ${region.hiddenGems || ''}</p>
    `;


        }

        function handleSearch(event) {

            if (event.key === 'Enter') {
                findCommunity();
            }

        }

            loadRegion(region)


        });
